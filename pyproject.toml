[project]
name = "project-dsl"
version = "0.1.0"
description = "Phase 1: executable mini-DSL + interpreter verifier + small NTP Transformer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
dsl-train = "src.train:main"
dsl-eval = "src.eval:main"
dsl-gen = "src.data.generate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
